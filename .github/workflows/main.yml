name: Deploy Application
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Configure Docker for insecure registry (only if needed)
        run: |
          if ! grep -q "143.198.225.193:6060" /etc/docker/daemon.json 2>/dev/null; then
            echo '{ "insecure-registries": ["143.198.225.193:6060"] }' | sudo tee /etc/docker/daemon.json
            sudo systemctl restart docker
            sleep 5
          fi

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV }}" > .env

      - name: Login to Self-hosted Registry
        if: ${{ secrets.REGISTRY_USERNAME && secrets.REGISTRY_PASSWORD }}
        uses: docker/login-action@v2
        with:
          registry: 143.198.225.193:6060
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract branch name
        shell: bash
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV

      - name: Set image tag
        id: vars
        run: |
          echo "TAG=${BRANCH_NAME}-${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          echo "Testing registry connectivity..."
          curl -v http://143.198.225.193:6060/v2/ || echo "Registry connection warning, continuing..."

          echo "Building Docker image..."
          docker build --network=host \
            -t 143.198.225.193:6060/agro-app-backend:${{ env.TAG }} \
            -t 143.198.225.193:6060/agro-app-backend:latest .

          echo "Pushing Docker image with tag ${{ env.TAG }}..."
          for i in 1 2 3 4 5; do
            docker push 143.198.225.193:6060/agro-app-backend:${{ env.TAG }} && break || echo "Push attempt $i failed, retrying..."
            sleep 10
          done

          echo "Pushing Docker image with tag latest..."
          for i in 1 2 3 4 5; do
            docker push 143.198.225.193:6060/agro-app-backend:latest && break || echo "Push attempt $i failed, retrying..."
            sleep 10
          done

      - name: Deploy container
        run: |
          docker stop agro-app-backend || true
          docker rm agro-app-backend || true

          docker network ls | grep my-network || docker network create my-network

          echo "Pulling latest image..."
          docker pull 143.198.225.193:6060/agro-app-backend:latest

          echo "Starting container..."
          docker run -d \
            --name agro-app-backend \
            --restart unless-stopped \
            --network my-network \
            --env-file .env \
            -p 8090:7070 \
            143.198.225.193:6060/agro-app-backend:latest

          docker image prune -f

      - name: Verify deployment
        run: |
          if docker ps | grep agro-app-backend; then
            echo "Deployment successful: agro-app-backend is running"
          else
            echo "Deployment failed: agro-app-backend is not running"
            exit 1
          fi
          docker ps
