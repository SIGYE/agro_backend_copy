name: Deploy Application

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure Docker for insecure registry
        run: |
          echo '{ "insecure-registries": ["164.92.112.235:6060"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          # Wait for Docker to restart
          sleep 5

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV }}" > .env

      - name: Login to Self-hosted Registry (if needed)
        uses: docker/login-action@v2
        with:
          registry: 164.92.112.235:6060
          username: ${{ secrets.REGISTRY_USERNAME || '' }}
          password: ${{ secrets.REGISTRY_PASSWORD || '' }}
        # This step might be optional if your registry doesn't require authentication locally

      - name: Extract branch name
        shell: bash
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV

      - name: Set image tag
        id: vars
        run: |
          echo "TAG=${BRANCH_NAME}-${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: 164.92.112.235:6060/agro-app-backend:${{ env.TAG }},164.92.112.235:6060/agro-app-backend:latest
          cache-from: type=registry,ref=164.92.112.235:6060/agro-app-backend:latest
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Deploy container
        run: |
          # Stop and remove existing container if it exists
          docker stop agro-app-backend || true
          docker rm agro-app-backend || true
          
          # Configure Docker to trust the insecure registry if not already done
          if ! grep -q "164.92.112.235:6060" /etc/docker/daemon.json 2>/dev/null; then
            echo '{ "insecure-registries": ["164.92.112.235:6060"] }' | sudo tee /etc/docker/daemon.json
            sudo systemctl restart docker
            # Wait for Docker to restart
            sleep 5
          fi
          
          # Pull the latest image
          docker pull 164.92.112.235:6060/agro-app-backend:latest
          
          # Run the new container with the env file
          docker run -d \
            --name agro-app-backend \
            --restart unless-stopped \
            --network my-network \
            --env-file .env \
            -p 8090:7070 \
            164.92.112.235:6060/agro-app-backend:latest
          
          # Clean up old images
          docker image prune -af
